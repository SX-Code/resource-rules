<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <!-- 下载好的browser umd版本 -->
    <script src="./js/js-beautify.min.js"></script>
    <script src="./js/terser.min.js"></script>

    <script>
      // 格式化美化
      function beautifyJs(code) {
        try {
          return JSON.stringify({
            ok: true,
            data: js_beautify(code, { indent_size: 2 }),
          });
        } catch (e) {
          return JSON.stringify({ ok: false, error: e.message });
        }
      }

      // js语法校验：尝试parse，捕获语法错误
      function validateJs(code) {
        try {
          new Function(code);
          return JSON.stringify({ ok: true });
        } catch (e) {
          return JSON.stringify({ ok: false, error: e.message });
        }
      }

      // terser压缩混淆
      function minifyJs(code) {
        try {
          const res = Terser.minify_sync(code, {
            mangle: false,
            compress: false,
            format: {
              comments: false,
            },
          });
          if (res.error) {
            return JSON.stringify({ ok: false, error: res.error.message });
          }
          return JSON.stringify({ ok: true, data: res.code });
        } catch (e) {
          return JSON.stringify({ ok: false, error: e.message });
        }
      }
    </script>
  </body>
</html>
