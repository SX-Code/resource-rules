name: 校验并生成源索引

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 安装Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行校验+生成索引
        run: node scripts/build-index.js

      - name: 自动提交index.json变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if ! git diff --staged --quiet; then
            git commit -m "auto: 更新源索引index.json"
            git push
          else
            echo "index.json无变更，跳过提交"
          fi
